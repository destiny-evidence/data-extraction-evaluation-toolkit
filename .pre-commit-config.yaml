exclude: ^tests/integration/datasets/

default_language_version:
  node: lts

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []  # optionally list allowed types: [feat, fix, chore, ...]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --config=pyproject.toml
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --config=pyproject.toml
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy --config-file=pyproject.toml --scripts-are-modules
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint-fix
        exclude: ^deet/ui/terminal/templates
        args:
          - --dot
          - --config=.markdownlint.yaml

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-tabs

  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort-fix
        args: ["--check"]
        exclude: '^(uv\.lock)$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
        exclude: |
          (?x)^(
              (tests/test_files/.*)|
          )$

      - id: check-docstring-first
        exclude: |
          (?x)^(
              (tests/test_files/.*)|
          )$


      - id: check-merge-conflict
        exclude: |
          (?x)^(
              (tests/test_files/.*)|
          )$

      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              (tests/test_files/.*)|
          )$

      - id: mixed-line-ending
        exclude: |
          (?x)^(
              (tests/test_files/.*)|
          )$

        args:
          - --fix=lf
      - id: trailing-whitespace
        exclude: |
          (?x)^(
              (tests/test_files/.*)|
          )$
