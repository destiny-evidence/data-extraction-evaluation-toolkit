# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main, development]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the version bump commit + tag
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so PSR can read all commits
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Install semantic-release
        run: uv tool install python-semantic-release==10.7.0

      - name: Bump version and tag
        run: semantic-release -c pyproject.toml version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
