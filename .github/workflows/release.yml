# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main, development]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the version bump commit + tag
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so PSR can read all commits
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"

      - name: Install semantic-release
        run: uv tool install python-semantic-release==10.6.1 --with "gitpython<3.1.60"

      - name: Bump version and tag
        run: semantic-release -c pyproject.toml version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
