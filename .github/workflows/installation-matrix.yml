name: Installation Matrix Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  installation-scenarios:
    name: "${{ matrix.scenario }} on ${{ matrix.os }} (Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12.16", "3.13"]
        scenario: [tool-install, develop-sync, package-dependency]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Install pandoc (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install pandoc (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc

      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y
        continue-on-error: true

      - name: "Test: uv tool install"
        if: matrix.scenario == 'tool-install'
        env:
          PYTHONUTF8: "1" # fix encoding issues relating to GH windows runner using an outdated terminal
        run: |
          uv tool install --python ${{ matrix.python-version }} --no-build --no-binary-package destiny-deet .
          deet --help

      - name: "Test: uv sync (development)"
        if: matrix.scenario == 'develop-sync'
        run: |
          uv sync --locked --all-extras --all-groups --no-build --no-binary-package destiny-deet
          uv run deet --help
          uv run python -c "import deet; print('Import OK')"

      - name: "Test: uv add (as dependency)"
        if: matrix.scenario == 'package-dependency'
        run: |
          cd ${{ runner.temp }}
          mkdir test-consumer && cd test-consumer
          uv init --name test-consumer --no-readme  --python ${{ matrix.python-version }}
          uv add ${{ github.workspace }} --no-build --no-binary-package destiny-deet --no-binary-package test-consumer
          uv run python -c "import deet; print('Import OK')"
