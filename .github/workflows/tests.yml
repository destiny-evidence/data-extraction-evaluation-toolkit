name: data-extraction-evaluation-toolkit tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: write

jobs:
  data-extraction-evaluation-toolkit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12.16"
    if: github.event.pull_request.draft == false
    env:
      DEET_STARTUP_BUDGET_S: 0.6 # Maximum time deet --help an take before tests break
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: --all-extras
          # This environment is mostly a few large pre-built wheels (torch), so a cache saves
          # little over downloading them and each save evicts smaller caches.
          enable-cache: false

      - name: Run tests with pytest
        env:
          AZURE_API_KEY: "DUMMY_SECRET"
          AZURE_API_BASE: "https://dummy.secret"
        run: uv run pytest --cov=deet --cov-report=xml --record-mode=none

      - name: Code coverage reporting
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: "80 90"

      - name: Add title to coverage markdown file
        run: |
          echo '## data-extraction-evaluation-toolkit coverage' > data-extraction-evaluation-toolkit.md
          echo '---' >> data-extraction-evaluation-toolkit.md
          cat code-coverage-results.md >> data-extraction-evaluation-toolkit-results.md

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request'
        with:
          header: "data-extraction-evaluation-toolkit Coverage"
          recreate: true
          path: data-extraction-evaluation-toolkit-results.md

  # The branch ruleset requires this job, so the test job above can gain a matrix without renaming a required check.
  tests-passed:
    name: tests
    if: always()
    needs: [data-extraction-evaluation-toolkit_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the test jobs passed
        run: |
          case "${{ needs.data-extraction-evaluation-toolkit_tests.result }}" in
            success|skipped) ;;
            *) echo "Test jobs finished with: ${{ needs.data-extraction-evaluation-toolkit_tests.result }}"; exit 1 ;;
          esac
