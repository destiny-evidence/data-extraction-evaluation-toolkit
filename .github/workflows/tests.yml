name: data-extraction-evaluation-toolkit tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: write

jobs:
  data-extraction-evaluation-toolkit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12.16"
    if: github.event.pull_request.draft == false
    env:
      DEET_STARTUP_BUDGET_S: 0.6 # Maximum time deet --help an take before tests break
      UV_CACHE_DIR: /tmp/.uv-cache  # Configure a constant location for the uv cache
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          resolution-strategy: "lowest"

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests with pytest
        env:
          AZURE_API_KEY: "DUMMY_SECRET"
          AZURE_API_BASE: "https://dummy.secret"
        run: |
          TARGET_BRANCH=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          echo "Target branch is: $TARGET_BRANCH"

          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Running all tests (including real files)..."
            uv run pytest --cov=deet --cov-report=xml --record-mode=none
          else
            echo "Omitting real file parser tests..."
            uv run pytest --cov=deet --cov-report=xml --ignore=tests/test_parser_real_files.py  --record-mode=none
          fi

      - name: Code coverage reporting
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: "80 90"

      - name: Add title to coverage markdown file
        run: |
          echo '## data-extraction-evaluation-toolkit coverage' > data-extraction-evaluation-toolkit.md
          echo '---' >> data-extraction-evaluation-toolkit.md
          cat code-coverage-results.md >> data-extraction-evaluation-toolkit-results.md

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request'
        with:
          header: "data-extraction-evaluation-toolkit Coverage"
          recreate: true
          path: data-extraction-evaluation-toolkit-results.md

      - name: Minimize uv cache
        run: uv cache prune --ci

  # The branch ruleset requires this job, so the test job above can gain a matrix without renaming a required check.
  tests-passed:
    name: tests
    if: always()
    needs: [data-extraction-evaluation-toolkit_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the test jobs passed
        run: |
          case "${{ needs.data-extraction-evaluation-toolkit_tests.result }}" in
            success|skipped) ;;
            *) echo "Test jobs finished with: ${{ needs.data-extraction-evaluation-toolkit_tests.result }}"; exit 1 ;;
          esac
