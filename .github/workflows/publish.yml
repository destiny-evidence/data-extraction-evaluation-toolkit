name: Publish

# Release pushes the version tag with the app token, so the tag push triggers this
# workflow. Only stable tags are published; -dev prereleases from development are not.
on:
  push:
    tags:
      - "v*"
      - "!v*-dev*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches the package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          resolution-strategy: "lowest"

      - name: Build sdist and wheel
        run: uv build --no-config

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/destiny-deet
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Checkout pyproject.toml for the uv version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          resolution-strategy: "lowest"

      - name: Publish to TestPyPI
        run: >
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/destiny-deet
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Checkout pyproject.toml for the uv version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          resolution-strategy: "lowest"

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/
