      the world, for igniting dialogue, co-creating solutions or new directions and
      unravelling complex issues. The information within the pages of this guide is,
      therefore, meant to ensure that policymakers do not stand in a position where
      they see the daunting scale of the problem but feel unequipped to deal with
      it.\\\", \\\"attributes\\\": [{\\\"prompt\\\": \\\"Adjustments in natural or
