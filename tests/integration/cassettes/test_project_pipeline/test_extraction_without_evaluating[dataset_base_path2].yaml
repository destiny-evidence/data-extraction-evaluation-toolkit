      changes in temperature, precipitation, humidity, sea level, or wind) or a climate-related
      extreme event (e.g. heatwave, flood, drought, storm, wildfire, extreme cold)
      on human health, ecosystems, economies, or societies. This includes cases where
      a climate variable or extreme event modifies exposure to another hazard (e.g.
      temperature or drought altering air-pollution, wildfire-smoke, or infectious-disease
