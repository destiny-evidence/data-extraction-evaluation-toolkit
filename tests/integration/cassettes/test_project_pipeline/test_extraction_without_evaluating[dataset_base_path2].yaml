      agricultural measures (e.g. irrigation optimisation for water stress, flood
      modelling for planning, disaster preparedness). The paper need not frame these
      explicitly as responses to 'climate change'. Resilience is the capacity of individuals,
      communities, ecosystems, or systems to anticipate, withstand, recover from,
      and adapt to climate-related shocks and stresses. It is generally considered
      an adaptation outcome or objective.\\\", \\\"attribute_id\\\": 487, \\\"output_data_type\\\":
      \\\"bool\\\"}, {\\\"prompt\\\": \\\"Actions and strategies aimed at reducing
      or preventing greenhouse gas emissions in order to limit the magnitude of future
      climate change and its associated health and environmental impacts.\\\\n Assign
      when the study concerns greenhouse-gas emissions or fossil fuels \u2014 either
      (a) actions or strategies to reduce them (e.g. food-system, agricultural, transport,
      energy, or industrial measures that cut emissions), or (b) cases where emissions
