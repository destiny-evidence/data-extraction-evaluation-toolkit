    body: "{\"messages\":[{\"role\":\"system\",\"content\":\"You will be provided
      with a context from a paper and a list of attributes (questions) below.\\nBased
      on the context, answer every attribute and return a single JSON object containing
      one response per attribute. Each attribute response is keyed by its attribute
      id in the form \\\"attribute_<id>\\\" and must contain the output_data, additional_text
