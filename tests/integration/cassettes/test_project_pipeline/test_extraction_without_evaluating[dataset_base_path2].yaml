      since these imply potential mitigation actions. The study need not itself describe
      a mitigation action, and need not use the word 'mitigation'.\\\", \\\"attribute_id\\\":
      489, \\\"output_data_type\\\": \\\"bool\\\"}, {\\\"prompt\\\": \\\"The effects
      of climate change on natural and human systems, including consequences for health,
      ecosystems, economies, and societies resulting from climate variability and
      change.\\\\n Assign when the study characterises, measures, models, or reviews
      the effects, harms, hazards, or risks arising from a climate variable (e.g.
      changes in temperature, precipitation, humidity, sea level, or wind) or a climate-related
      extreme event (e.g. heatwave, flood, drought, storm, wildfire, extreme cold)
