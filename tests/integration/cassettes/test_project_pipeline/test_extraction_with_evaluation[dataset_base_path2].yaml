      maritime transport systems, including infrastructure, vehicles, and logistics
      operations.\\\", \\\"attribute_id\\\": 485, \\\"output_data_type\\\": \\\"bool\\\"}]}\"}],\"model\":\"gpt-4o-mini\",\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"llm_annotation_response\",\"schema\":{\"$defs\":{\"LLMBOOLAnnotationResponse\":{\"additionalProperties\":false,\"properties\":{\"output_data\":{\"description\":\"The
