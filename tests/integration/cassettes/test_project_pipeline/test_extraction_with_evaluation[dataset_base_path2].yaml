      housing provision, and construction.\\\", \\\"attribute_id\\\": 475, \\\"output_data_type\\\":
      \\\"bool\\\"}, {\\\"prompt\\\": \\\"The sector encompassing government agencies,
      civil services, and public institutions responsible for policy-making, regulation,
      and the delivery of public services in the context of climate change.\\\\n Assign
      only when the public-administration sector's own operations, services, or workforce
      are a subject of the study \u2014 i.e. public administration is the sector being
      examined (e.g. emergency-management or civil-service functions as the study's
      focus). Do not assign merely because a government is mentioned or acts, because
      policy or regulation is discussed, or because a public institution conducts
      or funds the study.\\\", \\\"attribute_id\\\": 483, \\\"output_data_type\\\":
      \\\"bool\\\"}, {\\\"prompt\\\": \\\"The sector encompassing crop cultivation,
      livestock rearing, aquaculture, fishing, and forest management.\\\", \\\"attribute_id\\\":
      474, \\\"output_data_type\\\": \\\"bool\\\"}, {\\\"prompt\\\": \\\"The sector
      encompassing banking, insurance, investment, and financial services, including
      public and private finance mechanisms.\\\", \\\"attribute_id\\\": 478, \\\"output_data_type\\\":
      \\\"bool\\\"}, {\\\"prompt\\\": \\\"The sector encompassing manufacturing, retail,
      wholesale trade, and commercial services.\\\", \\\"attribute_id\\\": 480, \\\"output_data_type\\\":
